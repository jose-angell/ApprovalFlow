services:
  postgres:
    image: postgres:17-alpine
    container_name: approvalflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - approvalflow_pgdata:/var/lib/postgresql/data

volumes:
  approvalflow_pgdata:
